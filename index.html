enos de un minuto te muestro cómo funciona.",tut2t:"Las raids son grupos de DJs",tut2x:"Una raid es un grupo de DJs que sigues juntos, como el grupo que se hace raid entre sí en Twitch. Crea todas las raids que quieras con este botón.",tut3t:"Agrega los DJs",tut3x:"Abre una raid y agrega los DJs por el nombre de su canal de Twitch. Si ya tienes una lista de canales, impórtala de una vez con el botón de lista.",tut4t:"Reproduce una o varias raids",tut4x:"El play de una raid abre en el escenario todos sus DJs que están en directo. Puedes reproducir varias raids al mismo tiempo: todos aparecen juntos, sin repetir a quien está en más de una. Quien sale del aire desaparece solo, y quien entra en directo aparece.",tut5t:"Destacar",tut5x:"Haz clic en la parte superior de un reproductor, en el nombre del DJ, para hacerlo grande. El sonido va con el destacado. Para volver todos al mismo tamaño, usa el botón Salir del foco o la tecla Esc.",tut6t:"Sonido de cada reproductor",tut6x:"El altavoz activa y desactiva el sonido solo de ese reproductor, sin cambiar el destacado ni el tamaño de nada. Puedes escuchar varios a la vez. Un clic dentro del video lo reproduce o lo pausa.",tut7t:"Chat",tut7x:"Este botón abre el chat del directo debajo del reproductor. Para escribir, inicia sesión en Twitch desde el propio chat. Si el inicio de sesión no termina (ventana privada, iPhone y algunos navegadores móviles), cambia al chat de Lurk en la parte superior del chat.",tut8t:"Comparte con tus amigos",tut8x:"Envía tus raids a tus compañeros con un enlace. Quien abre el enlace recibe las raids listas, con todos los DJs.",tut9t:"Configuración",tut9x:"Aquí cambias el idioma y la calidad de los videos, eliges seguir las raids de los DJs y puedes volver a ver este tutorial cuando quieras.",tutAtalhos:"Atajos: 1 a 9 destacan un reproductor, Shift + número activa o desactiva su sonido, M silencia todo."},de:{appConta:"Twitch-Konto",appEntrar:"Bei Twitch anmelden",appEntrarTxt:"Melde dich hier in de BP.",msgLogoSalva:"Logo von {r} gespeichert",msgLogoRemovida:"Logo von {r} entfernt",logoZoom:"Zoom",termosUso:"Nutzungsbedingungen",termos1:"Lurk DJ ist ein Projekt von BrendonStos. Code, Design und Name sind urheberrechtlich geschützt. Alle Rechte vorbehalten.",termos2:"Du darfst Lurk DJ auf dieser Website kostenlos nutzen. Ohne schriftliche Erlaubnis des Autors ist es nicht erlaubt, den Code ganz oder teilweise zu kopieren, zu ändern, woanders zu veröffentlichen, weiterzugeben oder zu verkaufen.",termos3:"Lurk DJ ist nicht mit Twitch verbunden und wird von Twitch weder gesponsert noch unterstützt. Streams werden über den offiziellen Twitch-Player angezeigt; es gelten die Nutzungsbedingungen und Community-Richtlinien von Twitch.",termos4:"Nutze Lurk DJ nicht, um Zuschauerzahlen künstlich zu erhöhen, etwa indem du denselben Kanal mehrfach öffnest oder Bots verwendest.",termos5:"Deine Raids und Einstellungen werden nur in deinem Browser gespeichert (und auf deinem PC, wenn du die Verknüpfung nutzt). Nichts wird an den Autor gesendet. Damit die App funktioniert, lädt sie Inhalte von Twitch, decapi.me (wer live ist) und Google Fonts (Schrift). Beim Teilen wird der Link mit is.gd gekürzt.",termos6:"Lurk DJ wird ohne Gewähr bereitgestellt. Der Autor haftet nicht für Fehler, Pausen oder Änderungen bei Twitch, die die Funktion beeinträchtigen.",termos7:"Diese Bedingungen können sich ändern. Wenn du die App weiter nutzt, akzeptierst du die aktuelle Version.",termosContato:"Kontakt und Anfragen zur Erlaubnis: twitch.tv/brendonstos",termosVersao:"Stand: {d}",exportarTip:"DJ-Liste dieses Raids kopieren (durch Kommas getrennt)",msgListaCopiada:"Liste von {r} kopiert ({n}). Du kannst sie bei Liste importieren oder überall einfügen",copieLista:"Liste kopieren:",segTxt:"{c} hat den Stream beendet. Raid zu jemandem außerhalb der Gruppe?",segPh:"Kanal, der geraidet wurde",segVer:"Nur ansehen",segVerTip:"Jetzt stumm öffnen, ohne im Raid zu speichern",segAdd:"Zu {r} hinzufügen",segAd ermenü nach "Lurk DJ installieren" (manchmal unter "Apps").',bvTitulo:"Willkommen bei Lurk DJ",bvTxt:"Lurk DJ öffnet die Streams deiner DJ-Partner, sortiert nach Raids. Es nutzt die Twitch-Anmeldung dieses Browsers, du musst dich also nicht neu anmelden.",bvComecar:"Los geht's",importarLista:"Liste importieren",impTxt:"Füge die Kanäle durch Kommas getrennt ein. Namen oder Twitch-Links gehen, auch eine Liste mit einem pro Zeile.",impPh:"dj1, dj2, twitch.tv/dj3",impArquivo:"Oder öffne eine .txt-Datei mit der Liste",impDestino:"Wohin",impNova:"Neuer Raid",impNome:"Name des Raids",impBotao:"Importieren",impVazio:"Füge mindestens einen Kanal ein",impNada:"Keine neuen Kanäle zum Importieren",impConferindo:"Prüfe {n} Kanäle auf Twitch...",impResultado:"{n} in den Raid {r} importiert",abrirAtalho:'Öffne es über die Verknüpfung "Abrir Lurk DJ". Als Datei geöffnet, lädt Twitch den Player nicht.',chatLurk:"Lurk-Chat",chatTwitch:"Twitch-Chat",usarLurk:"Anmeldung klappt nicht? Lurk-Chat nutzen",usarTwitch:"Zurück zum Twitch-Chat",chatEntrar:"Mit Twitch anmelden, um zu schreiben",chatPh:"Nachricht als {u}",chatEnviar:"Senden",chatConectando:"Verbinde mit dem Chat...",chatEntrou:"Du bist im Chat von {c}.",contaTit:"Anmeldung für den Lurk-Chat",contaTxt:"Wird vom Lurk-Chat genutzt, damit du schreiben kannst, auch im privaten Fenster und am Handy. Die Anmeldung bleibt nur auf diesem Gerät und du kannst dich jederzeit abmelden.",contaEntrar:"Mit Twitch anmelden",contaSair:"Abmelden",contaComo:"Angemeldet als {u}",contaErro:"Anmeldung mit Twitch fehlgeschlagen. Versuch es noch mal.",contaExpirou:"Deine Twitch-Anmeldung in Lurk ist abgelaufen. Melde dich erneut an, um im Chat zu schreiben.",contaSemApp:"Die Twitch-Anmeldung in Lurk wird gerade aktiviert.",loginOk:"Angemeldet. Du kannst dieses Fenster schließen.",tutPular:"Überspringen",tutVoltar:"Zurück",tutProximo:"Weiter",tutConcluir:"Fertig",tutCriar:"Meinen Raid erstellen",tutPasso:"{a} von {b}",tutTitulo:"Tutorial",tutVer:"Tutorial ansehen",tutCfgTxt:"Ein kurzer Rundgang durch alles, was Lurk DJ kann.",tutNovo:"Neu in Lurk DJ: ein kurzes Tutorial, das alles zeigt, was du tun kannst.",tutVerAgora:"Jetzt ansehen",tutAgoraNao:"Später",tut1t:"Willkommen bei Lurk DJ",tut1x:"Lurk DJ hält die Streams deiner DJ-Partner auf einem Bildschirm offen, damit du allen folgen und die Zuschauerzahl deiner Gruppe stärken kannst. In weniger als einer Minute zeige ich dir, wie es funktioniert.",tut2t:"Raids sind DJ-Gruppen",tut2x:"Ein Raid ist eine Gruppe von DJs, denen du gemeinsam folgst, wie die Gruppe, die sich auf Twitch gegenseitig raidet. Mit diesem Button erstellst du beliebig viele Raids.",tut3t:"DJs hinzufügen",tut3x:"Öffne einen Raid und füge DJs über ihren Twitch-Kanalnamen hinzu. Wenn du schon eine Kanalliste hast, importierst du sie mit dem Listen-Button auf einmal.",tut4t:"Einen oder mehrere Raids abspielen",tut4x:"Der Play-Button eines Raids öffnet alle DJs, die gerade live sind, auf der Bühne. Du kannst mehrere Raids gleichzeitig abspielen: Alle erscheinen zusammen, ohne DJs doppelt zu zeigen, die in mehreren Raids sind. Wer offline geht, verschwindet von selbst, und wer live geht, erscheint.",tut5t:"Fokus",tut5x:"Klicke oben auf einen Player, auf den Namen des DJs, um ihn groß zu machen. Der Ton folgt dem Fokus. Um alle wieder gleich groß zu machen, nutze den Button Fokus beenden oder die Esc-Taste.",tut6t:"Ton für jeden Player",tut6x:"Der Lautsprecher schaltet den Ton nur dieses Players ein und aus, ohne den Fokus oder die Größe zu ändern. Du kannst mehrere gleichzeitig hören. Ein Klick ins Video startet oder pausiert es.",tut7t:"Chat",tut7x:"Dieser Button öffnet den Chat des Streams unter dem Player. Zum Schreiben meldest du dich direkt im Chat bei Twitch an. Wenn die Anmeldung nicht abschließt (privates Fenster, iPhone und manche mobilen Browser), wechsle oben im Chat zum Lurk-Chat.",tut8t:"Mit Freunden teilen",tut8x:"Schick deine Raids per Link an deine Partner. Wer den Link öffnet, bekommt die Raids fertig mit allen DJs.",tut9t:"Einstellungen",tut9x:"Hier änderst du Sprache und Videoqualität, legst fest, ob du den Raids der DJs folgst, und kannst dieses Tutorial jederzeit wieder ansehen.",tutAtalhos:"Kürzel: 1 bis 9 fokussieren einen Player, Shift + Zahl schaltet seinen Ton ein oder aus, M schaltet alles stumm."},it:{appConta:"Account Twitch",appEntrar:"Accedi a Twitch",appEntrarTxt:"Accedi una volta qui nell’app, così le live contano con il tuo account e la chat ti mostra connesso.",segVazio:"Scrivi prima il canale che ha ricevuto il raid",compGerando:"Creo il link corto...",compLinkLongo:"Non è stato possibile accorciarlo ora. Questo è il link completo e funziona uguale.",compLogo:"Invia con il logo",estParado:"FERMO",estParadoTip:"Twitch non è ripartito da solo. Clicca su ricarica in questo player.",estAnuncio:"PUBBLICITÀ",estAnuncioTip:"Twitch sta mostrando una pubblicità (schermata Preparing). Il player riparte da solo quando finisce.",verRaids:"I miei raid",cvTit1:"Hai ricevuto un raid",cvTitN:"Hai ricevuto {n} raid",cvSub1:"Salvalo per aprire con un clic chi è in diretta.",cvSubN:"Scegli quali salvare. Poi premi ▶ per aprire chi è in diretta.",compTitulo1:"Condividi il raid",compTituloN:"Condividi i raid",compTxt:"Chi apre il link riceve i raid con i DJ, senza registrazione.",compCopiar:"Copia link",compWa:"Invia su WhatsApp",compCopiado:"Link copiato. Incollalo su WhatsApp, Discord o dove vuoi.",compNenhuma:"Scegli almeno un raid.",waTexto:"Andiamo in lurk! Apri questo link per salvare i raid su Lurk DJ:",fechar:"Chiudi",compartilharTodas:"Condividi tutti i raid",conviteN:"Hai ricevuto {n} raid. Scegli quali salvare:",salvarSelecionadas:"Salva selezionati",msgSalvasN:"{n} raid salvati nella tua lista",conviteRuim:"Questo link del raid è incompleto. Chiedi di copiarlo di nuovo.",cfgPequenosTxt:"Vale per tutti i player non in primo piano. Più bassa rende tutto più leggero.",logoRaid:"Logo del raid",logoTip:"Clicca per aggiungere o cambiare il :"Ha la sua icona e si apre in una finestra tutta sua.",cfgInstalarMenu:'Nel menu del browser, cerca "Installa Lurk DJ" (a volte è in "App").',bvTitulo:"Benvenuto in Lurk DJ",bvTxt:"Lurk DJ apre le dirette dei tuoi partner DJ, organizzate per raid. Usa l'accesso a Twitch di questo browser, quindi non devi accedere di nuovo.",bvComecar:"Inizia",importarLista:"Importa lista",impTxt:"Incolla i canali separati da virgole. Vanno bene i nomi o i link di Twitch, e anche una lista con uno per riga.",impPh:"dj1, dj2, twitch.tv/dj3",impArquivo:"Oppure apri un file .txt con la lista",impDestino:"Dove",impNova:"Nuovo raid",impNome:"Nome del raid",impBotao:"Importa",impVazio:"Incolla almeno un canale",impNada:"Nessun canale nuovo da importare",impConferindo:"Controllo {n} canali su Twitch...",impResultado:"{n} importati nel raid {r}",abrirAtalho:'Aprilo con il collegamento "Abrir Lurk DJ". Aperto come file, Twitch non carica il player.',chatLurk:"Chat di Lurk",chatTwitch:"Chat di Twitch",usarLurk:"L'accesso non funziona? Usa la chat di Lurk",usarTwitch:"Torna alla chat di Twitch",chatEntrar:"Accedi con Twitch per scrivere",chatPh:"Messaggio come {u}",chatEnviar:"Invia",chatConectando:"Connessione alla chat...",chatEntrou:"Sei nella chat di {c}.",contaTit:"Accesso alla chat di Lurk",contaTxt:"Usato dalla chat di Lurk per farti scrivere, anche in finestra privata e sul telefono. L'accesso resta solo su questo dispositivo e puoi uscire quando vuoi.",contaEntrar:"Accedi con Twitch",contaSair:"Esci",contaComo:"Connesso come {u}",contaErro:"Accesso con Twitch non riuscito. Riprova.",contaExpirou:"L'accesso a Twitch in Lurk è scaduto. Accedi di nuovo per scrivere in chat.",contaSemApp:"L'accesso a Twitch in Lurk è ancora in fase di attivazione.",loginOk:"Accesso eseguito. Puoi chiudere questa finestra.",tutPular:"Salta",tutVoltar:"Indietro",tutProximo:"Avanti",tutConcluir:"Fine",tutCriar:"Crea il mio raid",tutPasso:"{a} di {b}",tutTitulo:"Tutorial",tutVer:"Guarda il tutorial",tutCfgTxt:"Un giro veloce di tutto quello che fa Lurk DJ.",tutNovo:"Novità in Lurk DJ: un tutorial veloce che mostra tutto quello che puoi fare.",tutVerAgora:"Guarda ora",tutAgoraNao:"Non ora",tut1t:"Benvenuto in Lurk DJ",tut1x:"Lurk DJ tiene aperte in un solo schermo le dirette dei tuoi partner DJ, così segui tutti e dai forza al pubblico del gruppo. In meno di un minuto ti mostro come funziona.",tut2t:"I raid sono gruppi di DJ",tut2x:"Un raid è un gruppo di DJ che segui insieme, come il gruppo che si fa raid a vicenda su Twitch. Crea tutti i raid che vuoi con questo pulsante.",tut3t:"Aggiungi i DJ",tut3x:"Apri un raid e aggiungi i DJ con il nome del loro canale Twitch. Se hai già una lista di canali, importala tutta insieme con il pulsante lista.",tut4t:"Avvia uno o più raid",tut4x:"Il play di un raid apre sul palco tutti i suoi DJ in diretta. Puoi avviare più raid insieme: tutti compaiono insieme, senza ripetere chi è in più di uno. Chi va offline sparisce da solo, e chi va in diretta compare.",tut5t:"In primo piano",tut5x:"Clicca sulla parte alta di un player, sul nome del DJ, per ingrandirlo. L'audio segue il primo piano. Per riportare tutti alla stessa dimensione, usa il pulsante Esci dal focus o il tasto Esc.",tut6t:"Audio di ogni player",tut6x:"L'altoparlante attiva e disattiva l'audio solo di quel player, senza cambiare il primo piano né la dimensione di niente. Puoi ascoltarne più di uno insieme. Un clic dentro il video lo avvia o lo mette in pausa.",tut7t:"Chat",tut7x:"Questo pulsante apre la chat della diretta sotto il player. Per scrivere, accedi a Twitch dalla chat stessa. Se l'accesso non si completa (finestra privata, iPhone e alcuni browser mobili), passa alla chat di Lurk in alto nella chat.",tut8t:"Condividi con gli amici",tut8x:"Manda i tuoi raid ai partner con un link. Chi apre il link riceve i raid pronti, con tutti i DJ.",tut9t:"Impostazioni",tut9x:"Qui cambi lingua e qualità dei video, scegli se seguire i raid dei DJ e puoi rivedere questo tutorial quando vuoi.",tutAtalhos:"Scorciatoie: da 1 a 9 mettono un player in primo piano, Shift + numero attiva o disattiva il suo audio, M silenzia tutto."},fr:{appConta:"Compte Twitch",appEntrar:"Se connecter à Twitch",appEntrarTxt:"Connecte-toi une fois ici dans l’app pour que les lives comptent avec ton compte et que le chat t’affiche connecté.",segVazio:"Tape d’abord la chaîne qui a reçu le raid",compGerando:"Création du lien court...",compLinkLongo:"Impossible de raccourcir pour le moment. Voici le lien complet, il marche pareil.",compLogo:"Envoyer avec le logo",estParado:"ARRÊTÉ",estParadoTip:"Twitch n’a pas repris tout seul. Clique sur recharger sur ce lecteur.",estAnuncio:"PUB",estAnuncioTip:"Twitch diffuse une pub (écran Preparing). Le lecteur reprend tout seul à la fin.",verRaids:"Mes raids",cvTit1:"Tu as reçu un raid",cvTitN:"Tu as reçu {n} raids",cvSub1:"Enregistre-le pour ouvrir en un clic tous ceux qui sont en direct.",cvSubN:"Choisis lesquels enregistrer. Ensuite, appuie sur ▶ pour ouvrir tous ceux qui sont en direct.",compTitulo1:"Partager le raid",compTituloN:"Partager les raids",compTxt:"Celui qui ouvre le lien reçoit les raids avec les DJ, sans inscription.",compCopiar:"Copier le lien",compWa:"Envoyer sur WhatsApp",compCopiado:"Lien copié. Colle-le sur WhatsApp, Discord ou ailleurs.",compNenhuma:"Choisis au moins un raid.",waTexto:"On lurk ! Ouvre ce lien pour enregistrer les raids dans Lurk DJ :",fechar:"Fermer",compartilharTodas:"Partager tous les raids",conviteN:"Tu as reçu {n} raids. Choisis lesquels enregistrer :",salvarSelecionadas:"Enregistrer la sélection",msgSalvasN:"{n} raids enregistrés dans ta liste",conviteRuim:"Ce lien de raid est incomplet. Demande à la personne de le recopier.",cfgPequenosTxt:"S’applique à tous les lecteurs hors focus. Plus basse allège tout.",logoRaid:"Logo du raid",logoTip:"Clique pour ajouter ou changer le logo du raid",logoDica:"Fais glisser l’image pour ajuster le cadrage. Utilise le curseur ou la molette pour zoomer."
